name: Bug report
description: The npm package, the renderer or the Inspector does something wrong with a chart.
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - "npm package: parsing or analysis"
        - "npm package: rendering (SVG, WebP, GIF)"
        - Inspector
        - Annotation tools
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The npm version or the commit you ran.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The call, command or clicks, in order.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: >-
        Attach the chart's `.osu` file renamed to `.txt` (GitHub does not accept `.osu`), and a
        screenshot if the problem is visual.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version and operating system; for the Inspector, the browser too.
